
server.port=8080
spring.application.name=gateway

# Eureka Setup
eureka.client.service-url.defaultZone=http://registry:9000/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Actuator

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Route Forwarding
spring.cloud.gateway.server.webflux.routes[0].id=bridge
spring.cloud.gateway.server.webflux.routes[0].uri=lb://BRIDGE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ws/**

spring.cloud.gateway.server.webflux.routes[1].id=bridge-api
spring.cloud.gateway.server.webflux.routes[1].uri=lb://BRIDGE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/bridge/**

spring.cloud.gateway.server.webflux.routes[2].id=user
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USER
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webflux.routes[3].id=device
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DEVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/device/**

spring.cloud.gateway.server.webflux.routes[4].id=automation
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUTOMATION
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/automation/**


logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty=DEBUG
logging.level.org.springframework.web.reactive=DEBUG