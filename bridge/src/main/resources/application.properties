server.port=8081
spring.application.name=bridge


# Eureka setup
eureka.client.service-url.defaultZone=http://registry:9000/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=bridge
eureka.instance.prefer-ip-address=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

#MQTT setup
mqtt.broker-url=${MQTT_URL}
mqtt.client-id=amberBackend
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}

#DATA BASE
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# STOMP logging
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.messaging.simp.stomp=TRACE

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5s

# Optional
spring.data.redis.connect-timeout=5s

# Lettuce Pool for redis usecase
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2s

# Kafka Config
spring.kafka.bootstrap-servers=kafka:9092

# Jwt
jwt.secret=${JWT_SECRET}
jwt.access.expiration=900000
jwt.refresh.expiration=2592000000